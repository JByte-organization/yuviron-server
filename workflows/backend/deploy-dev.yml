name: Deploy backend

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: [self-hosted, yuviron]

    steps:
      - name: Update backend source
        run: |
          set -e
          cd /opt/yuviron-server/src/yuviron-backend
          git fetch origin dev
          git reset --hard origin/dev
          git clean -fd

      - name: Generate Secrets Config
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_MANAGER_EMAIL: ${{ secrets.SEED_MANAGER_EMAIL }}
          SEED_MANAGER_PASSWORD: ${{ secrets.SEED_MANAGER_PASSWORD }}
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SEED_PREMIUM_EMAIL: ${{ secrets.SEED_PREMIUM_EMAIL }}
          SEED_PREMIUM_PASSWORD: ${{ secrets.SEED_PREMIUM_PASSWORD }}
        run: |
          set -e
          ENV_FILE="Development"
          CONFIG_PATH="/opt/yuviron-server/src/yuviron-backend/src/Yuviron.Api/appsettings.${ENV_FILE}.json"

          mkdir -p "$(dirname "$CONFIG_PATH")"

          python3 - <<'PY' > "$CONFIG_PATH"
          import json
          import os

          config = {
              "JwtSettings": {
                  "Secret": os.environ["JWT_SECRET"],
                  "Issuer": "YuvironApi",
                  "Audience": "YuvironClient",
                  "ExpiryMinutes": 60
              },
              "Email": {
                  "Host": "smtp.gmail.com",
                  "Port": 587,
                  "Username": os.environ["EMAIL_USERNAME"],
                  "Password": os.environ["EMAIL_PASSWORD"]
              },
              "SeedUsers": {
                  "Admin": {
                      "Email": os.environ["SEED_ADMIN_EMAIL"],
                      "Password": os.environ["SEED_ADMIN_PASSWORD"]
                  },
                  "Manager": {
                      "Email": os.environ["SEED_MANAGER_EMAIL"],
                      "Password": os.environ["SEED_MANAGER_PASSWORD"]
                  },
                  "User": {
                      "Email": os.environ["SEED_USER_EMAIL"],
                      "Password": os.environ["SEED_USER_PASSWORD"]
                  },
                  "Premium": {
                      "Email": os.environ["SEED_PREMIUM_EMAIL"],
                      "Password": os.environ["SEED_PREMIUM_PASSWORD"]
                  }
              }
          }

          print(json.dumps(config, ensure_ascii=False, indent=2))
          PY

          python3 -m json.tool "$CONFIG_PATH" > /dev/null
          echo "✅ Configuration generated for environment: ${ENV_FILE}"

      - name: Rebuild migrator image
        run: |
          set -e
          cd /opt/yuviron-server/infra
          docker compose -f compose.dev.yml build yuviron-dev-migrator

      - name: Apply EF Core migrations
        run: |
          set -e
          cd /opt/yuviron-server/infra
          docker compose -f compose.dev.yml run --rm yuviron-dev-migrator

      - name: Rebuild and restart services
        run: |
          set -e
          cd /opt/yuviron-server/infra
          docker compose -f compose.dev.yml up -d --build --force-recreate yuviron-dev-backend yuviron-dev-frontend