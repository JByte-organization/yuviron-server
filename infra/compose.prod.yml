services:
  mysql:
    env_file:
      - ../env/prod.env
    restart: always

  migrator:
    env_file:
      - ../env/prod.env

  backend:
    env_file:
      - ../env/prod.env
    volumes:
      - ../storage/prod:/var/yuviron-server/storage
    restart: always

  admin:
    restart: always

  backoffice:
    restart: always

  client-app:
    restart: always

  nginx:
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLIENT_SERVER_NAME: yuviron.com
      ADMIN_SERVER_NAME: admin.yuviron.com
      BACKOFFICE_SERVER_NAME: backoffice.yuviron.com
      API_SERVER_NAME: api.yuviron.com

      CLIENT_APP_UPSTREAM: client-app:3000
      ADMIN_UPSTREAM: admin:3000
      BACKOFFICE_UPSTREAM: backoffice:3000
      BACKEND_UPSTREAM: backend:5073
    volumes:
      - ../edge/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../certs/yuviron-cert.pem:/etc/nginx/certs/cert.pem:ro
      - ../certs/yuviron-key.pem:/etc/nginx/certs/key.pem:ro
    command: >
      /bin/sh -c "envsubst '$$CLIENT_SERVER_NAME $$ADMIN_SERVER_NAME $$BACKOFFICE_SERVER_NAME $$API_SERVER_NAME $$CLIENT_APP_UPSTREAM $$ADMIN_UPSTREAM $$BACKOFFICE_UPSTREAM $$BACKEND_UPSTREAM'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    restart: always