services:
  mysql:
    env_file:
      - ../env/dev.env

  migrator:
    env_file:
      - ../env/dev.env

  backend:
    env_file:
      - ../env/dev.env
    volumes:
      - ../storage/dev:/var/yuviron-server/storage
    ports:
      - "5073:5073"

  media-worker:
    env_file:
      - ../env/dev.env
    volumes:
      - ../storage/dev:/var/yuviron-server/storage

  admin:
    ports:
      - "3001:3000"

  backoffice:
    ports:
      - "3002:3000"

  client-app:
    ports:
      - "3003:3000"

  seq:
    env_file:
      - ../env/dev.env
    volumes:
      - ../storage/dev/seq:/data

  aspire-dashboard:
    env_file:
      - ../env/dev.env
    environment:
      ASPNETCORE_URLS: ${ASPIRE_ASPNETCORE_URLS}
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: ${ASPIRE_OTLP_ENDPOINT_URL}
      Dashboard__Frontend__AuthMode: ${ASPIRE_FRONTEND_AUTH_MODE}
      Dashboard__Frontend__BrowserToken: ${ASPIRE_FRONTEND_BROWSER_TOKEN}
      DASHBOARD__OTLP__AUTHMODE: ApiKey
      DASHBOARD__OTLP__PRIMARYAPIKEY: ${ASPIRE_OTLP_API_KEY}

  rabbitmq:
    expose:
      - "5672"
      - "15672"
    volumes:
      - yuviron_rabbitmq:/var/lib/rabbitmq

  nginx:
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLIENT_SERVER_NAME: dev.yuviron.com
      ADMIN_SERVER_NAME: dev-admin.yuviron.com
      BACKOFFICE_SERVER_NAME: dev-backoffice.yuviron.com
      API_SERVER_NAME: dev-api.yuviron.com
      SEQ_SERVER_NAME: dev-seq.yuviron.com
      ASPIRE_SERVER_NAME: dev-aspire.yuviron.com
      RABBITMQ_SERVER_NAME: dev-rabbitmq.yuviron.com

      CLIENT_APP_UPSTREAM: client-app:3000
      ADMIN_UPSTREAM: admin:3000
      BACKOFFICE_UPSTREAM: backoffice:3000
      BACKEND_UPSTREAM: backend:5073
      SEQ_UPSTREAM: seq:80
      ASPIRE_UPSTREAM: aspire-dashboard:18888
      RABBITMQ_UPSTREAM: rabbitmq:15672
    volumes:
      - ../edge/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../certs/yuviron-cert.pem:/etc/nginx/certs/cert.pem:ro
      - ../certs/yuviron-key.pem:/etc/nginx/certs/key.pem:ro
    command: >
      /bin/sh -c "envsubst '$$CLIENT_SERVER_NAME $$ADMIN_SERVER_NAME $$BACKOFFICE_SERVER_NAME $$API_SERVER_NAME $$SEQ_SERVER_NAME $$ASPIRE_SERVER_NAME $$RABBITMQ_SERVER_NAME $$CLIENT_APP_UPSTREAM $$ADMIN_UPSTREAM $$BACKOFFICE_UPSTREAM $$BACKEND_UPSTREAM $$SEQ_UPSTREAM $$ASPIRE_UPSTREAM $$RABBITMQ_UPSTREAM'
      < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"