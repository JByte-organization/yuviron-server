x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
  ConnectionStrings__Default: ${ConnectionStrings__Default}
  ConnectionStrings__Redis: ${ConnectionStrings__Redis}
  FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT}
  Seq__ServerUrl: ${Seq__ServerUrl}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
  RabbitMQ__Host: ${RabbitMQ__Host}
  RabbitMQ__Port: ${RabbitMQ__Port}
  RabbitMQ__Username: ${RabbitMQ__Username}
  RabbitMQ__Password: ${RabbitMQ__Password}
  RabbitMQ__VirtualHost: ${RabbitMQ__VirtualHost}
  JamendoApi__ClientId: ${JamendoApi__ClientId}

services:
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME}-mysql
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}
    memswap_limit: ${MYSQL_MEMSWAP_LIMIT:-1g}
    cpus: ${MYSQL_CPUS:-1.0}

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    memswap_limit: ${REDIS_MEMSWAP_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.25}

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - default
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 60s
    mem_limit: ${RABBITMQ_MEM_LIMIT:-512m}
    memswap_limit: ${RABBITMQ_MEMSWAP_LIMIT:-512m}
    cpus: ${RABBITMQ_CPUS:-0.5}

  seq:
    image: datalust/seq:2025.2
    container_name: ${COMPOSE_PROJECT_NAME}-seq
    # Seq currently needs root to write to the bind-mounted /data directory.
    # Keep this exception explicit so it is not mistaken for an accidental root container.
    user: "0:0"
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINUSERNAME: ${SEQ_FIRSTRUN_ADMINUSERNAME}
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_FIRSTRUN_ADMINPASSWORDHASH}
    volumes:
      - ${SEQ_STORAGE_PATH}:/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/80' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: ${SEQ_MEM_LIMIT:-512m}
    memswap_limit: ${SEQ_MEMSWAP_LIMIT:-512m}
    cpus: ${SEQ_CPUS:-0.5}

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: ${COMPOSE_PROJECT_NAME}-aspire
    restart: ${RESTART_POLICY}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_URLS: ${ASPIRE_ASPNETCORE_URLS}
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: ${ASPIRE_OTLP_ENDPOINT_URL}
      Dashboard__Frontend__AuthMode: ${ASPIRE_FRONTEND_AUTH_MODE}
      Dashboard__Frontend__BrowserToken: ${ASPIRE_FRONTEND_BROWSER_TOKEN}
      DASHBOARD__OTLP__AUTHMODE: ApiKey
      DASHBOARD__OTLP__PRIMARYAPIKEY: ${ASPIRE_OTLP_API_KEY}
    expose:
      - "18888"
      - "18889"
    networks:
      - default
    mem_limit: ${ASPIRE_MEM_LIMIT:-256m}
    memswap_limit: ${ASPIRE_MEMSWAP_LIMIT:-256m}
    cpus: ${ASPIRE_CPUS:-0.25}

  migrator:
    build:
      context: ..
      dockerfile: infra/docker/migrator/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-migrator
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: ${ConnectionStrings__Default}
      ConnectionStrings__Redis: ${ConnectionStrings__Redis}
      FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT}
      Seq__ServerUrl: ${Seq__ServerUrl}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      RabbitMQ__Host: ${RabbitMQ__Host}
      RabbitMQ__Port: ${RabbitMQ__Port}
      RabbitMQ__Username: ${RabbitMQ__Username}
      RabbitMQ__Password: ${RabbitMQ__Password}
      RabbitMQ__VirtualHost: ${RabbitMQ__VirtualHost}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
    mem_limit: ${MIGRATOR_MEM_LIMIT:-512m}
    memswap_limit: ${MIGRATOR_MEMSWAP_LIMIT:-512m}
    cpus: ${MIGRATOR_CPUS:-0.5}
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    restart: ${RESTART_POLICY}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *dotnet-env
      ASPNETCORE_HTTP_PORTS: 5073
      Swagger__Enabled: ${Swagger__Enabled}
    volumes:
      - ${STORAGE_PATH}:/var/yuviron-server/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5073/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    memswap_limit: ${BACKEND_MEMSWAP_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-1.0}

  media-worker:
    build:
      context: ..
      dockerfile: infra/docker/media-worker/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-media-worker
    restart: ${RESTART_POLICY}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *dotnet-env
    volumes:
      - ${STORAGE_PATH}:/var/yuviron-server/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - default
    mem_limit: ${MEDIA_WORKER_MEM_LIMIT:-768m}
    memswap_limit: ${MEDIA_WORKER_MEMSWAP_LIMIT:-768m}
    cpus: ${MEDIA_WORKER_CPUS:-0.75}

  client-app:
    build:
      context: ../src/yuviron-frontend
      dockerfile: ../../infra/docker/frontend-next/Dockerfile
      args:
        APP_NAME: client-app
    container_name: ${COMPOSE_PROJECT_NAME}-client
    restart: ${RESTART_POLICY}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net = require('net'); const socket = net.connect(3000, '127.0.0.1'); socket.setTimeout(5000); socket.on('connect', () => process.exit(0)); socket.on('error', () => process.exit(1)); socket.on('timeout', () => process.exit(1));\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${CLIENT_APP_MEM_LIMIT:-256m}
    memswap_limit: ${CLIENT_APP_MEMSWAP_LIMIT:-256m}
    cpus: ${CLIENT_APP_CPUS:-0.25}

  nginx:
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: ${RESTART_POLICY}
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
      client-app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ../generated/${ENVIRONMENT}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../scripts/templates/proxy-params.conf:/etc/nginx/proxy-params.conf:ro
      - ../logs/${ENVIRONMENT}/nginx:/var/log/nginx
      - ${CERT_FILE}:/etc/nginx/certs/cert.pem:ro
      - ${KEY_FILE}:/etc/nginx/certs/key.pem:ro
    command: ["nginx", "-g", "daemon off;"]
    networks:
      - default
      - shared
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    memswap_limit: ${NGINX_MEMSWAP_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.25}

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_default
  shared:
    external: true
    name: ${SHARED_NETWORK}

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
