x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
  ConnectionStrings__Default: ${ConnectionStrings__Default}
  ConnectionStrings__Redis: ${ConnectionStrings__Redis}
  FILE_STORAGE_ROOT: ${FILE_STORAGE_ROOT}
  Seq__ServerUrl: ${Seq__ServerUrl}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
  RabbitMQ__Host: ${RabbitMQ__Host}
  RabbitMQ__Port: ${RabbitMQ__Port}
  RabbitMQ__Username: ${RabbitMQ__Username}
  RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
  RabbitMQ__VirtualHost: ${RabbitMQ__VirtualHost}
  JamendoApi__ClientId: ${JamendoApi__ClientId}

x-dotnet-build: &dotnet-build
  context: ..
  dockerfile: infra/docker/dotnet/Dockerfile

x-dotnet-build-args: &dotnet-build-args
  DOTNET_VERSION: ${DOTNET_VERSION}
  DOTNET_APP_UID: ${DOTNET_APP_UID}
  DOTNET_APP_GID: ${DOTNET_APP_GID}

x-dotnet-hardening: &dotnet-hardening
  user: "${DOTNET_APP_UID}:${DOTNET_APP_GID}"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-dotnet-service-defaults: &dotnet-service-defaults
  restart: ${RESTART_POLICY}
  volumes:
    - ${STORAGE_PATH}:/var/yuviron-server/storage
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - default

x-dotnet-worker-healthcheck: &dotnet-worker-healthcheck
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 60s

services:
  mysql:
    image: mysql:8.4@sha256:43bd9764df60666fb2ba2cf8217dd17b3d2414c150005d2fdd07a0cd73d3b7f5
    container_name: ${COMPOSE_PROJECT_NAME}-mysql
    user: "999:999"
    restart: ${RESTART_POLICY}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}
    memswap_limit: ${MYSQL_MEMSWAP_LIMIT:-1g}
    cpus: ${MYSQL_CPUS:-1.0}

  redis:
    image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: ${COMPOSE_PROJECT_NAME}-redis
    user: "999:999"
    restart: ${RESTART_POLICY}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    memswap_limit: ${REDIS_MEMSWAP_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.25}

  rabbitmq:
    image: rabbitmq:3-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: ${COMPOSE_PROJECT_NAME}-rabbitmq
    user: "999:999"
    restart: ${RESTART_POLICY}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - default
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # ping only verifies the Erlang node is alive; check_port_connectivity verifies
      # that the AMQP listener (5672) is actually accepting connections, which is
      # what the backend needs before it can establish a MassTransit connection.
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: ${RABBITMQ_MEM_LIMIT:-512m}
    memswap_limit: ${RABBITMQ_MEMSWAP_LIMIT:-512m}
    cpus: ${RABBITMQ_CPUS:-0.5}

  seq:
    image: datalust/seq:2025.2@sha256:868a12e93ec0b8c993767a7dd4cd6c8ebc441511c79e4cfac66c911f62d4db65
    container_name: ${COMPOSE_PROJECT_NAME}-seq
    profiles:
      - observability
    user: "${SEQ_UID:-1000}:${SEQ_GID:-1000}"
    restart: ${RESTART_POLICY}
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINUSERNAME: ${SEQ_FIRSTRUN_ADMINUSERNAME}
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_FIRSTRUN_ADMINPASSWORDHASH}
    volumes:
      - ${SEQ_STORAGE_PATH}:/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: ${SEQ_MEM_LIMIT:-512m}
    memswap_limit: ${SEQ_MEMSWAP_LIMIT:-512m}
    cpus: ${SEQ_CPUS:-0.5}

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0@sha256:d595645ca7f5c075174db998302d8fb09e040516b14dfcb06dd02996659e1c77
    container_name: ${COMPOSE_PROJECT_NAME}-aspire
    profiles:
      - observability
    restart: ${RESTART_POLICY}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ASPNETCORE_URLS: ${ASPIRE_ASPNETCORE_URLS}
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: ${ASPIRE_OTLP_ENDPOINT_URL}
      Dashboard__Frontend__AuthMode: ${ASPIRE_FRONTEND_AUTH_MODE}
      Dashboard__Frontend__BrowserToken: ${ASPIRE_FRONTEND_BROWSER_TOKEN}
      DASHBOARD__OTLP__AUTHMODE: ApiKey
      DASHBOARD__OTLP__PRIMARYAPIKEY: ${ASPIRE_OTLP_API_KEY}
    expose:
      - "18888"
      - "18889"
    networks:
      - default
    healthcheck:
      # aspire-dashboard:9.0 is a distroless (chiseled) image with no shell or Unix tools;
      # no service depends on aspire health, so the check is disabled rather than kept broken.
      disable: true
    mem_limit: ${ASPIRE_MEM_LIMIT:-256m}
    memswap_limit: ${ASPIRE_MEMSWAP_LIMIT:-256m}
    cpus: ${ASPIRE_CPUS:-0.25}

  migrator:
    <<: *dotnet-hardening
    profiles:
      - migrate
    build:
      <<: *dotnet-build
      target: migrator
      args:
        <<: *dotnet-build-args
        MIGRATOR_STARTUP_PROJECT: src/Yuviron.Api/Yuviron.Api.csproj
    container_name: ${COMPOSE_PROJECT_NAME}-migrator
    environment:
      <<: *dotnet-env
      ALLOW_PRODUCTION_MIGRATE: ${ALLOW_PRODUCTION_MIGRATE:-false}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - default
    mem_limit: ${MIGRATOR_MEM_LIMIT:-512m}
    memswap_limit: ${MIGRATOR_MEMSWAP_LIMIT:-512m}
    cpus: ${MIGRATOR_CPUS:-0.5}
    restart: "no"

  backend:
    <<: [*dotnet-hardening, *dotnet-service-defaults]
    build:
      <<: *dotnet-build
      target: backend
      args:
        <<: *dotnet-build-args
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    environment:
      <<: *dotnet-env
      ASPNETCORE_HTTP_PORTS: 5073
      Swagger__Enabled: ${Swagger__Enabled}
      # Suppress health check failure logs in both pipelines:
      # - Logging:LogLevel None disables the category in the standard ILogger pipeline.
      # - Serilog:MinimumLevel:Override Fatal suppresses it in the Serilog pipeline
      #   (which drives the OTLP/Aspire and Seq sinks).
      # Transient startup failures (rabbitmq, masstransit-bus "not started") are
      # expected until MassTransit establishes the AMQP connection; they must not
      # appear as errors in Aspire or Seq.
      Logging__LogLevel__Microsoft.Extensions.Diagnostics.HealthChecks: "None"
      Serilog__MinimumLevel__Override__Microsoft.Extensions.Diagnostics.HealthChecks: Fatal
    healthcheck:
      <<: *dotnet-worker-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5073/health/ready >/dev/null || exit 1"]
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    memswap_limit: ${BACKEND_MEMSWAP_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-1.0}

  media-worker:
    <<: [*dotnet-hardening, *dotnet-service-defaults]
    build:
      <<: *dotnet-build
      target: media-worker
      args:
        <<: *dotnet-build-args
    container_name: ${COMPOSE_PROJECT_NAME}-media-worker
    environment:
      <<: *dotnet-env
      ASPNETCORE_HTTP_PORTS: 5074
      Logging__LogLevel__Microsoft.Extensions.Diagnostics.HealthChecks: "None"
      Serilog__MinimumLevel__Override__Microsoft.Extensions.Diagnostics.HealthChecks: Fatal
    healthcheck:
      <<: *dotnet-worker-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5074/health/ready >/dev/null || exit 1"]
    mem_limit: ${MEDIA_WORKER_MEM_LIMIT:-768m}
    memswap_limit: ${MEDIA_WORKER_MEMSWAP_LIMIT:-768m}
    cpus: ${MEDIA_WORKER_CPUS:-0.75}

  nginx:
    build:
      context: ./edge
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    user: "10001:10001"
    group_add:
      - "${NGINX_CERT_GROUP_ID:-10001}"
    restart: ${RESTART_POLICY}
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
      media-worker:
        condition: service_healthy
      client-app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ../generated/${ENVIRONMENT}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../scripts/templates/proxy-params.conf:/etc/nginx/proxy-params.conf:ro
      - ../certs/acme-challenge:/var/www/certbot:ro
      - ../certs:/etc/nginx/certs:ro
      - ${NGINX_BASIC_AUTH_FILE}:/etc/nginx/htpasswd:ro
      - nginx_media_cache:/var/cache/nginx/yuviron_media
    command: ["nginx", "-g", "daemon off;"]
    networks:
      - default
      - shared
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health | grep -qx 'edge-nginx-ok' || exit 1; openssl x509 -checkend 0 -noout -in /etc/nginx/certs/${ENVIRONMENT}-${BASE_DOMAIN}.pem >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    memswap_limit: ${NGINX_MEMSWAP_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.25}

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}_default
  shared:
    external: true
    name: ${SHARED_NETWORK}

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  nginx_media_cache:
