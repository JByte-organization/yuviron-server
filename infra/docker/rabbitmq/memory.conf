# RabbitMQ memory watermark — Docker container override.
#
# By default RabbitMQ reads /proc/meminfo and sees the HOST RAM (~8 GB),
# so it calculates the high watermark at 40% of the host = ~3 GB. Inside a
# container with mem_limit: 768m this is dangerously wrong: the cgroup OOM
# killer terminates the memsup C port before RabbitMQ's own throttle engages,
# which crashes the Erlang node and causes the container to restart.
#
# Fix: set an absolute watermark well below the cgroup limit so RabbitMQ
# throttles publishers via flow control before any cgroup enforcement kicks in.
#
# If RABBITMQ_MEM_LIMIT changes, update this value to stay at ~65-70% of it:
#   512m  → 340MB
#   768m  → 512MB   ← current (dev + prod default)
#   1024m → 700MB
#
# Deliberately conservative (70% not 80%): during a reconnect storm each new
# connection reader adds ~2MB. With dozens of stale connections the headroom
# between watermark and cgroup limit evaporates quickly. The extra 15% buffer
# gives the healthcheck time to detect the alarm and restart before OOM.
vm_memory_high_watermark.absolute = 512MB
