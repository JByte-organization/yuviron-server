name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install -r requirements.txt

      - name: Run unit tests
        run: |
          cd scripts
          python3 -m unittest \
            tests.test_models \
            tests.test_paths \
            tests.test_findings \
            tests.test_env_validation \
            tests.test_config_loader_routes \
            tests.test_config_loader_stack_ports \
            tests.test_render_nginx \
            tests.test_render_compose \
            tests.test_dns_generate \
            tests.test_htpasswd \
            tests.test_core_preflight \
            tests.test_preflight_nginx \
            tests.test_preflight_generated \
            tests.test_security_audit \
            tests.test_generate_config \
            tests.test_smoke_logic \
            tests.test_python_requirements \
            -v

  e2e-dry-run:
    name: E2E dry-run (Docker)
    runs-on: [self-hosted, yuviron]

    steps:
      - uses: actions/checkout@v5

      - name: Run E2E dry-run
        env:
          YUVIRON_RUN_DOCKER_E2E: "1"
        run: |
          cd scripts
          python3 -m unittest tests.test_stack_e2e_dry_run -v

  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Scan dotnet/aspnet:9.0 base image (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'mcr.microsoft.com/dotnet/aspnet:9.0'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: 'true'

      - name: Scan nginx:alpine base image (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'nginx:alpine'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: 'true'

      - name: Build edge nginx image
        run: docker build -t yuviron-edge:ci -f infra/edge/Dockerfile infra/edge/

      - name: Scan built edge nginx image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'yuviron-edge:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: 'true'

  image-scan-built:
    name: Scan built application images
    runs-on: [self-hosted, yuviron]

    steps:
      - uses: actions/checkout@v5

      - name: Check backend source availability
        id: check-src
        run: |
          if [ -d "src/yuviron-backend/src/Yuviron.Api" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backend source not found in checkout; .NET image scan skipped. Add source as a submodule or ensure src/ is present on the runner."
          fi

      - name: Build backend image
        if: steps.check-src.outputs.available == 'true'
        run: |
          docker build \
            --target backend \
            --build-arg RUNTIME_PACKAGES="wget ffmpeg" \
            -t yuviron-backend:ci \
            -f infra/docker/dotnet/Dockerfile \
            .

      - name: Scan built backend image
        if: steps.check-src.outputs.available == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'yuviron-backend:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Build media-worker image
        if: steps.check-src.outputs.available == 'true'
        run: |
          docker build \
            --target media-worker \
            --build-arg RUNTIME_PACKAGES="wget ffmpeg" \
            -t yuviron-media-worker:ci \
            -f infra/docker/dotnet/Dockerfile \
            .

      - name: Scan built media-worker image
        if: steps.check-src.outputs.available == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'yuviron-media-worker:ci'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: 'true'

      - name: Clean up CI images
        if: always()
        run: docker rmi yuviron-backend:ci yuviron-media-worker:ci 2>/dev/null || true