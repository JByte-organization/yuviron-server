name: Deploy frontend prod

on:
  push:
    branches: [main]

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, yuviron]

    steps:
      - name: Sync frontend source
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server/src/yuviron-frontend
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Preflight check
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          chmod +x ./scripts/preflight-check.sh
          ./scripts/preflight-check.sh prod /opt/yuviron-server

      - name: Validate frontend source
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server/src/yuviron-frontend
          chmod +x ./scripts/check-frontend.sh
          ./scripts/check-frontend.sh

      - name: Build frontend services
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          docker compose \
            -p yuviron-prod \
            -f ./infra/compose.base.yml \
            -f ./infra/compose.prod.yml \
            build admin backoffice client-app

      - name: Restart frontend services
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          docker compose \
            -p yuviron-prod \
            -f ./infra/compose.base.yml \
            -f ./infra/compose.prod.yml \
            up -d --no-deps admin backoffice client-app

      - name: Show running services
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          docker compose \
            -p yuviron-prod \
            -f ./infra/compose.base.yml \
            -f ./infra/compose.prod.yml \
            ps