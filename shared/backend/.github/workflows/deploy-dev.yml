name: Deploy backend and media worker dev

on:
  push:
    branches: [dev]

concurrency:
  group: yuviron-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, yuviron]
    environment: dev

    steps:
      - name: Capture deployed backend revision
        id: deployed-revision
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server/src/yuviron-backend

          previous_sha="$(git rev-parse --verify HEAD)"
          rollback_dir="/tmp/yuviron-rollback/backend-dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          umask 077
          mkdir -p "$rollback_dir"

          for path in \
            src/Yuviron.Api/appsettings.Development.json \
            src/Yuviron.MediaWorker/appsettings.Development.json
          do
            if [ -f "$path" ]; then
              mkdir -p "$rollback_dir/$(dirname "$path")"
              cp "$path" "$rollback_dir/$path"
            fi
          done

          echo "previous_sha=${previous_sha}" >> "$GITHUB_OUTPUT"
          echo "rollback_dir=${rollback_dir}" >> "$GITHUB_OUTPUT"
          echo "Previous backend revision: ${previous_sha}"

      - name: Sync backend source
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server/src/yuviron-backend
          git fetch origin dev
          git reset --hard origin/dev
          git clean -fd

      - name: Generate Development appsettings
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_MANAGER_EMAIL: ${{ secrets.SEED_MANAGER_EMAIL }}
          SEED_MANAGER_PASSWORD: ${{ secrets.SEED_MANAGER_PASSWORD }}
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SEED_PREMIUM_EMAIL: ${{ secrets.SEED_PREMIUM_EMAIL }}
          SEED_PREMIUM_PASSWORD: ${{ secrets.SEED_PREMIUM_PASSWORD }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          STREAM_SECRET: ${{ secrets.STREAM_SECRET }}
        run: |
          set -Eeuo pipefail

          ENV_FILE="Development"
          API_CONFIG_PATH="/opt/yuviron-server/src/yuviron-backend/src/Yuviron.Api/appsettings.${ENV_FILE}.json"
          WORKER_CONFIG_PATH="/opt/yuviron-server/src/yuviron-backend/src/Yuviron.MediaWorker/appsettings.${ENV_FILE}.json"

          mkdir -p "$(dirname "$API_CONFIG_PATH")"
          mkdir -p "$(dirname "$WORKER_CONFIG_PATH")"

          python3 - <<'PY' > "$API_CONFIG_PATH"
          import json
          import os

          config = {
              "CorsSettings": {
                  "AllowedOrigins": [
                      "https://yuviron.com",
                      "https://backoffice.yuviron.com",
                      "https://admin.yuviron.com",
                      "https://dev.yuviron.com",
                      "https://dev-backoffice.yuviron.com",
                      "https://dev-admin.yuviron.com"
                  ]
              },
              "JwtSettings": {
                  "Secret": os.environ["JWT_SECRET"],
                  "Issuer": "YuvironApi",
                  "Audience": "YuvironClient",
                  "ExpiryMinutes": 60
              },
              "Email": {
                  "Host": "smtp.gmail.com",
                  "Port": 587,
                  "Username": os.environ["EMAIL_USERNAME"],
                  "Password": os.environ["EMAIL_PASSWORD"]
              },
              "SeedUsers": {
                  "Admin": {
                      "Email": os.environ["SEED_ADMIN_EMAIL"],
                      "Password": os.environ["SEED_ADMIN_PASSWORD"]
                  },
                  "Manager": {
                      "Email": os.environ["SEED_MANAGER_EMAIL"],
                      "Password": os.environ["SEED_MANAGER_PASSWORD"]
                  },
                  "User": {
                      "Email": os.environ["SEED_USER_EMAIL"],
                      "Password": os.environ["SEED_USER_PASSWORD"]
                  },
                  "Premium": {
                      "Email": os.environ["SEED_PREMIUM_EMAIL"],
                      "Password": os.environ["SEED_PREMIUM_PASSWORD"]
                  }
              },
              "JamendoApi": {
                  "ClientId": os.environ["JAMENDO_CLIENT_ID"]
              },
              "StreamSecurity": {
                  "SecretKey": os.environ["STREAM_SECRET"]
              }
          }

          print(json.dumps(config, ensure_ascii=False, indent=2))
          PY

          python3 - <<'PY' > "$WORKER_CONFIG_PATH"
          import json
          import os

          config = {
              "JamendoApi": {
                  "ClientId": os.environ["JAMENDO_CLIENT_ID"]
              }
          }

          print(json.dumps(config, ensure_ascii=False, indent=2))
          PY

          python3 -m json.tool "$API_CONFIG_PATH" >/dev/null
          python3 -m json.tool "$WORKER_CONFIG_PATH" >/dev/null

      - name: Cleanup stale migrator run containers before deploy
        if: always()
        run: |
          set -Eeuo pipefail
          docker ps -aq \
            --filter "name=yuviron-dev-migrator-run" \
            | xargs -r docker rm -f

      - name: Docker disk usage before deploy
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py tools docker-clean --mode report

      - name: Preflight check
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py stack preflight dev

      - name: Start full dev stack
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          timeout 1200 python3 ./scripts/cli.py stack up dev

      - name: Smoke test dev stack
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py stack smoke dev

      - name: Rollback backend dev stack
        if: failure() && steps.deployed-revision.outputs.previous_sha != ''
        env:
          PREVIOUS_SHA: ${{ steps.deployed-revision.outputs.previous_sha }}
          ROLLBACK_DIR: ${{ steps.deployed-revision.outputs.rollback_dir }}
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server/src/yuviron-backend

          echo "Rolling back backend source to ${PREVIOUS_SHA}"
          git fetch --depth=1 origin "${PREVIOUS_SHA}" || true
          git reset --hard "${PREVIOUS_SHA}"
          git clean -fd

          for path in \
            src/Yuviron.Api/appsettings.Development.json \
            src/Yuviron.MediaWorker/appsettings.Development.json
          do
            if [ -f "${ROLLBACK_DIR}/${path}" ]; then
              mkdir -p "$(dirname "$path")"
              cp "${ROLLBACK_DIR}/${path}" "$path"
            else
              echo "No rollback appsettings backup found for ${path}"
            fi
          done

          cd /opt/yuviron-server
          timeout 1200 python3 ./scripts/cli.py stack up dev
          python3 ./scripts/cli.py stack smoke dev

      - name: Cleanup backend rollback snapshot
        if: always()
        env:
          ROLLBACK_DIR: ${{ steps.deployed-revision.outputs.rollback_dir }}
        run: |
          set -Eeuo pipefail
          if [ -n "${ROLLBACK_DIR}" ] && [ -d "${ROLLBACK_DIR}" ]; then
            rm -rf "${ROLLBACK_DIR}"
          fi

      - name: Trim Docker build cache
        if: success()
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py tools docker-clean --mode build-cache --reserved-space 10gb --yes

      - name: Docker disk usage after cleanup
        if: always()
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py tools docker-clean --mode report

      - name: Show running services
        if: always()
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          docker compose \
            --env-file ./generated/dev/deploy.env \
            -f ./infra/compose.yml \
            -f ./generated/dev/compose.frontends.yml \
            -p yuviron-dev \
            ps

      - name: Show backend logs
        if: always()
        run: |
          set -Eeuo pipefail
          docker logs --tail=160 yuviron-dev-backend || true

      - name: Show media worker logs
        if: always()
        run: |
          set -Eeuo pipefail
          docker logs --tail=160 yuviron-dev-media-worker || true

      - name: Show nginx logs
        if: always()
        run: |
          set -Eeuo pipefail
          docker logs --tail=160 yuviron-dev-nginx || true

      - name: Cleanup stale migrator run containers after deploy
        if: always()
        run: |
          set -Eeuo pipefail
          docker ps -aq \
            --filter "name=yuviron-dev-migrator-run" \
            | xargs -r docker rm -f
