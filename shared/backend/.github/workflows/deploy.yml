name: Deploy backend and media worker

on:
  push:
    branches: [dev, main]

concurrency:
  group: yuviron-${{ github.ref_name == 'main' && 'prod' || 'dev' }}-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, yuviron]
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      ASPNET_ENV: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
      SOURCE_BRANCH: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Capture deployed backend revision
        id: deployed-revision
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server/src/yuviron-backend

          previous_sha="$(git rev-parse --verify HEAD)"
          rollback_dir="/tmp/yuviron-rollback/backend-${DEPLOY_ENV}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          umask 077
          mkdir -p "$rollback_dir"

          for path in \
            "src/Yuviron.Api/appsettings.${ASPNET_ENV}.json" \
            "src/Yuviron.MediaWorker/appsettings.${ASPNET_ENV}.json"
          do
            if [ -f "$path" ]; then
              mkdir -p "$rollback_dir/$(dirname "$path")"
              cp "$path" "$rollback_dir/$path"
            fi
          done

          echo "previous_sha=${previous_sha}" >> "$GITHUB_OUTPUT"
          echo "rollback_dir=${rollback_dir}" >> "$GITHUB_OUTPUT"
          echo "Previous backend revision: ${previous_sha}"

      - name: Sync backend source
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server/src/yuviron-backend
          git fetch origin "${SOURCE_BRANCH}"
          incoming_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$incoming_sha" != "${{ github.sha }}" ]; then
            echo "ERROR: fetched SHA ${incoming_sha} does not match trigger SHA ${{ github.sha }}" >&2
            exit 1
          fi
          echo "Verified: incoming SHA ${incoming_sha}"
          git reset --hard "$incoming_sha"
          git clean -fd

      - name: Generate appsettings
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_MANAGER_EMAIL: ${{ secrets.SEED_MANAGER_EMAIL }}
          SEED_MANAGER_PASSWORD: ${{ secrets.SEED_MANAGER_PASSWORD }}
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SEED_PREMIUM_EMAIL: ${{ secrets.SEED_PREMIUM_EMAIL }}
          SEED_PREMIUM_PASSWORD: ${{ secrets.SEED_PREMIUM_PASSWORD }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          STREAM_SECRET: ${{ secrets.STREAM_SECRET }}
        run: |
          set -Eeuo pipefail

          API_CONFIG_PATH="/opt/yuviron-server/src/yuviron-backend/src/Yuviron.Api/appsettings.${ASPNET_ENV}.json"
          WORKER_CONFIG_PATH="/opt/yuviron-server/src/yuviron-backend/src/Yuviron.MediaWorker/appsettings.${ASPNET_ENV}.json"

          mkdir -p "$(dirname "$API_CONFIG_PATH")"
          mkdir -p "$(dirname "$WORKER_CONFIG_PATH")"

          umask 077
          API_CONFIG_TMP="$(mktemp "$(dirname "$API_CONFIG_PATH")/.appsettings.${ASPNET_ENV}.api.XXXXXX")"
          WORKER_CONFIG_TMP="$(mktemp "$(dirname "$WORKER_CONFIG_PATH")/.appsettings.${ASPNET_ENV}.worker.XXXXXX")"
          cleanup_tmp_configs() {
            if [ -n "${API_CONFIG_TMP:-}" ]; then
              rm -f "$API_CONFIG_TMP"
            fi
            if [ -n "${WORKER_CONFIG_TMP:-}" ]; then
              rm -f "$WORKER_CONFIG_TMP"
            fi
          }
          trap cleanup_tmp_configs EXIT

          python3 - <<'PY' > "$API_CONFIG_TMP"
          import json
          import os

          is_prod = os.environ["DEPLOY_ENV"] == "prod"

          cors_origins = [
              "https://yuviron.com",
              "https://backoffice.yuviron.com",
              "https://admin.yuviron.com",
          ]
          if not is_prod:
              cors_origins += [
                  "https://dev.yuviron.com",
                  "https://dev-backoffice.yuviron.com",
                  "https://dev-admin.yuviron.com",
                  "http://localhost:3000",
              ]

          config = {
              "CorsSettings": {"AllowedOrigins": cors_origins},
              "JwtSettings": {
                  "Secret": os.environ["JWT_SECRET"],
                  "Issuer": "YuvironApi",
                  "Audience": "YuvironClient",
                  "ExpiryMinutes": 60,
              },
              "Email": {
                  "Host": "smtp.gmail.com",
                  "Port": 587,
                  "Username": os.environ["EMAIL_USERNAME"],
                  "Password": os.environ["EMAIL_PASSWORD"],
              },
              "SeedUsers": {
                  "Admin": {
                      "Email": os.environ["SEED_ADMIN_EMAIL"],
                      "Password": os.environ["SEED_ADMIN_PASSWORD"],
                  },
                  "Manager": {
                      "Email": os.environ["SEED_MANAGER_EMAIL"],
                      "Password": os.environ["SEED_MANAGER_PASSWORD"],
                  },
                  "User": {
                      "Email": os.environ["SEED_USER_EMAIL"],
                      "Password": os.environ["SEED_USER_PASSWORD"],
                  },
                  "Premium": {
                      "Email": os.environ["SEED_PREMIUM_EMAIL"],
                      "Password": os.environ["SEED_PREMIUM_PASSWORD"],
                  },
              },
              "JamendoApi": {"ClientId": os.environ["JAMENDO_CLIENT_ID"]},
              "StreamSecurity": {"SecretKey": os.environ["STREAM_SECRET"]},
          }

          print(json.dumps(config, ensure_ascii=False, indent=2))
          PY

          python3 - <<'PY' > "$WORKER_CONFIG_TMP"
          import json
          import os

          config = {
              "JamendoApi": {
                  "ClientId": os.environ["JAMENDO_CLIENT_ID"]
              }
          }

          print(json.dumps(config, ensure_ascii=False, indent=2))
          PY

          python3 -m json.tool "$API_CONFIG_TMP" >/dev/null
          python3 -m json.tool "$WORKER_CONFIG_TMP" >/dev/null

          mv -f "$API_CONFIG_TMP" "$API_CONFIG_PATH"
          API_CONFIG_TMP=""
          mv -f "$WORKER_CONFIG_TMP" "$WORKER_CONFIG_PATH"
          WORKER_CONFIG_TMP=""
          trap - EXIT

      - name: Cleanup stale migrator run containers before deploy
        if: always()
        run: |
          set -Eeuo pipefail
          docker ps -aq \
            --filter "name=yuviron-${DEPLOY_ENV}-migrator-run" \
            | xargs -r docker rm -f

      - name: Docker disk usage before deploy
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py tools docker-clean --mode report

      - name: Preflight check
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py stack preflight "${DEPLOY_ENV}"

      - name: Start full stack
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          timeout 1200 python3 ./scripts/cli.py stack up "${DEPLOY_ENV}"

      - name: Scan deployed images for vulnerabilities
        env:
          TRIVY_EXIT_CODE: ${{ github.ref_name == 'main' && '1' || '0' }}
        run: |
          set -Eeuo pipefail
          FAILED=0
          for container in \
            "yuviron-${DEPLOY_ENV}-backend" \
            "yuviron-${DEPLOY_ENV}-media-worker" \
            "yuviron-${DEPLOY_ENV}-nginx"
          do
            IMAGE=$(docker inspect --format '{{.Image}}' "$container" 2>/dev/null || true)
            if [ -z "$IMAGE" ]; then
              echo "Container not found, skipping scan: $container"
              continue
            fi
            echo "=== Trivy: $container ==="
            if ! docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/trivy \
              aquasec/trivy:latest image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --no-progress \
              --exit-code "${TRIVY_EXIT_CODE}" \
              "$IMAGE"
            then
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "Trivy found fixable CRITICAL/HIGH CVEs in ${FAILED} image(s). Blocking ${DEPLOY_ENV} deployment."
            exit 1
          fi

      - name: Smoke test
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py stack smoke "${DEPLOY_ENV}"

      - name: Rollback backend
        if: failure() && steps.deployed-revision.outputs.previous_sha != ''
        env:
          PREVIOUS_SHA: ${{ steps.deployed-revision.outputs.previous_sha }}
          ROLLBACK_DIR: ${{ steps.deployed-revision.outputs.rollback_dir }}
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server/src/yuviron-backend

          echo "Rolling back backend source to ${PREVIOUS_SHA}"
          git fetch --depth=1 origin "${PREVIOUS_SHA}" || true
          if ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            echo "ERROR: rollback SHA ${PREVIOUS_SHA} is not available after fetch attempt" >&2
            exit 1
          fi
          echo "Verified: rollback SHA ${PREVIOUS_SHA} is accessible"
          git reset --hard "${PREVIOUS_SHA}"
          git clean -fd

          for path in \
            "src/Yuviron.Api/appsettings.${ASPNET_ENV}.json" \
            "src/Yuviron.MediaWorker/appsettings.${ASPNET_ENV}.json"
          do
            if [ -f "${ROLLBACK_DIR}/${path}" ]; then
              mkdir -p "$(dirname "$path")"
              cp "${ROLLBACK_DIR}/${path}" "$path"
            else
              echo "No rollback appsettings backup found for ${path}"
            fi
          done

          cd /opt/yuviron-server
          timeout 1200 python3 ./scripts/cli.py stack up "${DEPLOY_ENV}" --no-rollback --skip-migrate --no-build
          python3 ./scripts/cli.py stack smoke "${DEPLOY_ENV}"

      - name: Cleanup backend rollback snapshot
        if: always()
        env:
          ROLLBACK_DIR: ${{ steps.deployed-revision.outputs.rollback_dir }}
        run: |
          set -Eeuo pipefail
          if [ -n "${ROLLBACK_DIR}" ] && [ -d "${ROLLBACK_DIR}" ]; then
            rm -rf "${ROLLBACK_DIR}"
          fi

      - name: Trim Docker build cache
        if: success()
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py tools docker-clean --mode build-cache --reserved-space 10gb --yes

      - name: Docker disk usage after cleanup
        if: always()
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          python3 ./scripts/cli.py tools docker-clean --mode report

      - name: Show running services
        if: always()
        run: |
          set -Eeuo pipefail
          cd /opt/yuviron-server
          docker compose \
            --env-file "./generated/${DEPLOY_ENV}/deploy.env" \
            -f ./infra/compose.yml \
            -f "./generated/${DEPLOY_ENV}/compose.frontends.yml" \
            -p "yuviron-${DEPLOY_ENV}" \
            ps

      - name: Show backend logs
        if: always()
        run: |
          set -Eeuo pipefail
          docker logs --tail=160 "yuviron-${DEPLOY_ENV}-backend" || true

      - name: Show media worker logs
        if: always()
        run: |
          set -Eeuo pipefail
          docker logs --tail=160 "yuviron-${DEPLOY_ENV}-media-worker" || true

      - name: Show nginx logs
        if: always()
        run: |
          set -Eeuo pipefail
          docker logs --tail=160 "yuviron-${DEPLOY_ENV}-nginx" || true

      - name: Cleanup stale migrator run containers after deploy
        if: always()
        run: |
          set -Eeuo pipefail
          docker ps -aq \
            --filter "name=yuviron-${DEPLOY_ENV}-migrator-run" \
            | xargs -r docker rm -f