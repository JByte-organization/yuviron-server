name: Deploy backend and media worker

on:
  push:
    branches: [dev, main]

concurrency:
  group: yuviron-${{ github.ref_name == 'main' && 'prod' || 'dev' }}-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, yuviron]
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      ASPNET_ENV: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
      GHA_DEPLOY_TITLE: Backend deploy

    steps:
      - name: Initialize deploy summary
        run: |
          set -Eeuo pipefail
          git -C /opt/yuviron-server/src/yuviron-backend fetch --depth=1 origin "${{ github.sha }}"
          git -C /opt/yuviron-server/src/yuviron-backend show \
            "${{ github.sha }}:scripts/ci/github_actions_observe.sh" \
            > "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_init_summary

      - name: Capture deployed backend revision
        id: deployed-revision
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Capture deployed revision" "DevOps / server" "Runner workspace" \
            "Could not capture current deployed backend revision. Check runner workspace and git state."
          cd /opt/yuviron-server/src/yuviron-backend

          previous_sha="$(git rev-parse --verify HEAD)"
          rollback_dir="/tmp/yuviron-rollback/backend-${DEPLOY_ENV}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          umask 077
          mkdir -p "$rollback_dir"

          for path in \
            "src/Yuviron.Api/appsettings.${ASPNET_ENV}.json" \
            "src/Yuviron.MediaWorker/appsettings.${ASPNET_ENV}.json"
          do
            if [ -f "$path" ]; then
              mkdir -p "$rollback_dir/$(dirname "$path")"
              cp "$path" "$rollback_dir/$path"
            fi
          done

          echo "previous_sha=${previous_sha}" >> "$GITHUB_OUTPUT"
          echo "rollback_dir=${rollback_dir}" >> "$GITHUB_OUTPUT"
          echo "Previous backend revision: ${previous_sha}"
          gha_pass_stage "Previous revision: \`${previous_sha}\`."

      - name: Sync backend source
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Sync backend source" "CI / GitHub" "GitHub source / runner git" \
            "Could not fetch or verify trigger commit. Check GitHub ref, git credentials, and local repo state."
          cd /opt/yuviron-server/src/yuviron-backend
          git fetch origin "${{ github.sha }}"
          incoming_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$incoming_sha" != "${{ github.sha }}" ]; then
            echo "ERROR: fetched SHA ${incoming_sha} does not match trigger SHA ${{ github.sha }}" >&2
            exit 1
          fi
          echo "Verified: incoming SHA ${incoming_sha}"
          git reset --hard "$incoming_sha"
          git clean -fd
          gha_pass_stage "Deployed commit: \`${incoming_sha}\`."

      - name: Generate appsettings
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          SEED_MANAGER_EMAIL: ${{ secrets.SEED_MANAGER_EMAIL }}
          SEED_MANAGER_PASSWORD: ${{ secrets.SEED_MANAGER_PASSWORD }}
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SEED_PREMIUM_EMAIL: ${{ secrets.SEED_PREMIUM_EMAIL }}
          SEED_PREMIUM_PASSWORD: ${{ secrets.SEED_PREMIUM_PASSWORD }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          STREAM_SECRET: ${{ secrets.STREAM_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Generate appsettings" "CI / secrets" "GitHub Secrets / backend config" \
            "Appsettings generation failed. Most likely a missing GitHub Secret or config schema issue."
          cd /opt/yuviron-server/src/yuviron-backend
          python3 scripts/generate_appsettings.py
          gha_pass_stage "Appsettings generated for API and media worker."

      - name: Cleanup stale migrator run containers before deploy
        if: always()
        run: |
          set -Eeuo pipefail
          echo "::group::Cleanup stale migrator containers before deploy"
          docker ps -aq \
            --filter "name=yuviron-${DEPLOY_ENV}-migrator-run" \
            | xargs -r docker rm -f
          echo "::endgroup::"

      - name: Docker disk usage before deploy
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Docker disk report before deploy" "DevOps / server" "Runner Docker host" \
            "Could not collect Docker disk usage report." \
            "python3 ./scripts/cli.py tools docker-clean --mode report" \
            "warning"
          cd /opt/yuviron-server
          python3 ./scripts/cli.py tools docker-clean --mode report
          gha_pass_stage "Docker disk report collected."

      - name: Preflight check
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Preflight check" "DevOps / server" "Server config / Docker host" \
            "Preflight rejected deploy. Check generated config, env files, Docker access, storage, disk, compose, and nginx config." \
            "python3 ./scripts/cli.py stack preflight ${DEPLOY_ENV}"
          cd /opt/yuviron-server
          timeout 300 python3 ./scripts/cli.py stack preflight "${DEPLOY_ENV}" \
            --skip-connectivity-check \
            --skip-swagger
          gha_pass_stage "Host and generated config checks passed."

      - name: Run DB migrations
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Run DB migrations" "Backend / DB" "EF Core / database" \
            "DB migration failed. Check migrator logs and database state." \
            "python3 ./scripts/cli.py stack migrate ${DEPLOY_ENV}"
          cd /opt/yuviron-server
          timeout 300 python3 ./scripts/cli.py stack migrate "${DEPLOY_ENV}"
          gha_pass_stage "EF Core migrations applied."

      - name: Build and start services
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Build and start services" "Backend / Docker" "Application build / Docker" \
            "Stack startup failed. Check Docker build logs, compose startup, and service health." \
            "docker logs yuviron-${DEPLOY_ENV}-backend --tail 50"
          cd /opt/yuviron-server
          timeout 1200 python3 ./scripts/cli.py stack up "${DEPLOY_ENV}" \
            --skip-migrate \
            --skip-swagger \
            --build-services backend media-worker nginx
          gha_pass_stage "Backend, media worker, and nginx were built and started."

      - name: Scan deployed images for vulnerabilities
        env:
          TRIVY_EXIT_CODE: ${{ github.ref_name == 'main' && '1' || '0' }}
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Trivy vulnerability scan" "Security" "Container image dependencies" \
            "Trivy found blocking vulnerabilities or scanner failed. Prod blocks fixable HIGH/CRITICAL CVEs."
          FAILED=0
          for container in \
            "yuviron-${DEPLOY_ENV}-backend" \
            "yuviron-${DEPLOY_ENV}-media-worker" \
            "yuviron-${DEPLOY_ENV}-nginx"
          do
            IMAGE=$(docker inspect --format '{{.Image}}' "$container" 2>/dev/null || true)
            if [ -z "$IMAGE" ]; then
              echo "::warning title=Trivy scan skipped::Container not found, skipping scan: $container"
              continue
            fi
            echo "::group::Trivy: $container"
            if ! docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp/trivy-cache:/root/.cache/trivy \
              aquasec/trivy:0.70.0 image \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --no-progress \
              --exit-code "${TRIVY_EXIT_CODE}" \
              "$IMAGE"
            then
              FAILED=$((FAILED + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "Trivy found fixable CRITICAL/HIGH CVEs in ${FAILED} image(s). Blocking ${DEPLOY_ENV} deployment."
          fi
          test "$FAILED" -eq 0
          gha_pass_stage "Vulnerability scan completed for deployed images."

      - name: Smoke test
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Smoke test" "Backend / routing" "Runtime services / routing" \
            "Smoke test failed. Check service health, backend readiness, nginx routes, and HTTPS." \
            "python3 ./scripts/cli.py stack smoke ${DEPLOY_ENV}"
          cd /opt/yuviron-server
          timeout 120 python3 ./scripts/cli.py stack smoke "${DEPLOY_ENV}"
          gha_pass_stage "Smoke checks passed."

      - name: Rollback backend
        id: rollback-backend
        if: failure() && steps.deployed-revision.outputs.previous_sha != ''
        env:
          PREVIOUS_SHA: ${{ steps.deployed-revision.outputs.previous_sha }}
          ROLLBACK_DIR: ${{ steps.deployed-revision.outputs.rollback_dir }}
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          gha_begin_stage "Rollback backend" "DevOps / server" "Recovery / previous deployment" \
            "Automatic rollback failed. Manual recovery required." \
            "docker logs yuviron-${DEPLOY_ENV}-backend --tail 50"
          cd /opt/yuviron-server/src/yuviron-backend

          echo "Rolling back backend source to ${PREVIOUS_SHA}"
          git fetch --depth=1 origin "${PREVIOUS_SHA}" || true
          if ! git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            echo "ERROR: rollback SHA ${PREVIOUS_SHA} is not available after fetch attempt" >&2
            exit 1
          fi
          echo "Verified: rollback SHA ${PREVIOUS_SHA} is accessible"
          git reset --hard "${PREVIOUS_SHA}"
          git clean -fd

          for path in \
            "src/Yuviron.Api/appsettings.${ASPNET_ENV}.json" \
            "src/Yuviron.MediaWorker/appsettings.${ASPNET_ENV}.json"
          do
            if [ -f "${ROLLBACK_DIR}/${path}" ]; then
              mkdir -p "$(dirname "$path")"
              cp "${ROLLBACK_DIR}/${path}" "$path"
            else
              echo "No rollback appsettings backup found for ${path}"
            fi
          done

          cd /opt/yuviron-server
          timeout 1200 python3 ./scripts/cli.py stack up "${DEPLOY_ENV}" --no-rollback --skip-migrate --no-build
          timeout 120 python3 ./scripts/cli.py stack smoke "${DEPLOY_ENV}"
          gha_pass_stage "Rolled back to \`${PREVIOUS_SHA}\` and smoke checks passed."

      - name: Deploy outcome summary
        if: always()
        run: |
          set -Eeuo pipefail
          source "${RUNNER_TEMP}/yuviron-gha-observe.sh"
          if [ "${{ job.status }}" = "success" ]; then
            outcome="**deploy succeeded**"
          elif [ "${{ steps.rollback-backend.outcome }}" = "success" ]; then
            outcome="deploy failed, **rollback succeeded**"
          elif [ "${{ steps.rollback-backend.outcome }}" = "failure" ]; then
            outcome="deploy failed, **rollback failed** — manual recovery may be required"
          else
            outcome="deploy failed, rollback not attempted"
          fi
          gha_render_summary "${outcome}" "${DEPLOY_ENV}"

      - name: Cleanup backend rollback snapshot
        if: always()
        env:
          ROLLBACK_DIR: ${{ steps.deployed-revision.outputs.rollback_dir }}
        run: |
          set -Eeuo pipefail
          echo "::group::Cleanup backend rollback snapshot"
          if [ -n "${ROLLBACK_DIR}" ] && [ -d "${ROLLBACK_DIR}" ]; then
            rm -rf "${ROLLBACK_DIR}"
          fi
          echo "::endgroup::"

      - name: Trim Docker build cache
        if: "!cancelled()"
        run: |
          set -Eeuo pipefail
          echo "::group::Trim Docker build cache"
          cd /opt/yuviron-server
          python3 ./scripts/cli.py tools docker-clean --mode build-cache --reserved-space 10gb --yes
          echo "::endgroup::"

      - name: Docker disk usage after cleanup
        if: always()
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          echo "::group::Docker disk usage after cleanup"
          cd /opt/yuviron-server
          python3 ./scripts/cli.py tools docker-clean --mode report
          echo "::endgroup::"

      - name: Show running services
        if: always()
        run: |
          set -Eeuo pipefail
          echo "::group::Running services"
          cd /opt/yuviron-server
          docker compose \
            --env-file "./generated/${DEPLOY_ENV}/deploy.env" \
            -f ./infra/compose.yml \
            -f "./generated/${DEPLOY_ENV}/compose.frontends.yml" \
            -p "yuviron-${DEPLOY_ENV}" \
            ps
          echo "::endgroup::"

      - name: Show service logs
        if: always()
        run: |
          set -Eeuo pipefail
          for service in backend media-worker nginx; do
            echo "::group::Logs: yuviron-${DEPLOY_ENV}-${service}"
            docker logs --tail=160 "yuviron-${DEPLOY_ENV}-${service}" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Cleanup stale migrator run containers after deploy
        if: always()
        run: |
          set -Eeuo pipefail
          echo "::group::Cleanup stale migrator containers after deploy"
          docker ps -aq \
            --filter "name=yuviron-${DEPLOY_ENV}-migrator-run" \
            | xargs -r docker rm -f
          echo "::endgroup::"
