########################################
# DEV
########################################
upstream yuviron_frontend_dev {
    server yuviron-dev-frontend:3000;
}

upstream yuviron_backend_dev {
    server yuviron-dev-backend:5073;
}

########################################
# PROD
########################################
# Когда будет prod, подключаем сеть/сервисы
# upstream yuviron_frontend_prod {
#     server yuviron-prod-frontend:3000;
# }
#
# upstream yuviron_backend_prod {
#     server yuviron-prod-backend:5073;
# }

server {
    client_max_body_size 10M;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

server {
    listen 80;
    server_name
        dev.yuviron.com
        api-dev.yuviron.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/yuviron-cert.pem;
    ssl_certificate_key /etc/nginx/certs/yuviron-key.pem;

    return 444;
}

server {
    listen 443 ssl;
    server_name dev.yuviron.com;

    ssl_certificate     /etc/nginx/certs/yuviron-cert.pem;
    ssl_certificate_key /etc/nginx/certs/yuviron-key.pem;

    location ^~ /api/     { return 404; }
    location ^~ /swagger/ { return 404; }

    location / {
        proxy_pass http://yuviron_frontend_dev;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

server {
    listen 443 ssl;
    server_name api-dev.yuviron.com;

    ssl_certificate     /etc/nginx/certs/yuviron-cert.pem;
    ssl_certificate_key /etc/nginx/certs/yuviron-key.pem;

    location ^~ /api/ {
        proxy_pass http://yuviron_backend_dev;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location ^~ /swagger/ {
        proxy_pass http://yuviron_backend_dev;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location ^~ /health/ {
        proxy_pass http://yuviron_backend_dev;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / { return 404; }
}