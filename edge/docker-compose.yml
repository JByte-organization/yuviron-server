services:
  yuviron-edge-nginx:
    image: nginx:alpine
    container_name: yuviron-edge-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
